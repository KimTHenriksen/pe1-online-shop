<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Online Shop, view your shopping cart" />
    <title>Shopping Cart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/cart.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="../index.html" class="logo">
          <img src="../images/Logo.svg" alt="Online Shop" />
        </a>
        <button
          class="burger-menu"
          aria-label="Open menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <ul>
          <li><a href="../index.html">Products</a></li>
          <li><a href="index.html">Cart</a></li>
          <li><a href="../account/login.html" id="login-link">Login</a></li>
        </ul>
      </nav>
    </header>

    <main class="cart-page">
      <h1>Shopping Cart</h1>
      <button class="secondary-button clear-cart-button">Clear Cart</button>
      <section class="cart-box">
        <section class="cart-items"></section>
        <section class="cart-summary">
          <h2>Order Summary</h2>
          <div class="order-summary">
            <p>Subtotal</p>
            <p class="subtotal"></p>
          </div>
          <div class="order-summary">
            <p>Shipping</p>
            <p>Free</p>
          </div>
          <div class="order-summary">
            <p>Total</p>
            <p class="total-price"></p>
          </div>
          <a
            href="../checkout/index.html"
            class="primary-button checkout-button"
          >
            Proceed to Checkout
          </a>
        </section>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Online Shop</p>
    </footer>
    <script type="module" src="../js/cart.js"></script>
  </body>
</html>
