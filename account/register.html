<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Online Shop, create a new account" />
    <title>Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/account.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="../index.html" class="logo">
          <img src="../images/Logo.svg" alt="Online Shop" />
        </a>
        <button
          class="burger-menu"
          aria-label="Open menu"
          aria-expanded="false"
        >
          ☰
        </button>

        <ul>
          <li><a href="../index.html">Products</a></li>
          <li><a href="../cart/index.html">Cart</a></li>
          <li><a href="login.html" id="login-link">Login</a></li>
        </ul>
      </nav>
    </header>
    <main class="account-page">
      <section class="account-card">
        <h1>Register</h1>
        <p class="account-text">Create your account</p>
        <form id="registerForm" class="account-form">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Name"
            required
          />
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
          <p id="registerMessage" class="message"></p>
          <button id="registerButton" class="primary-button" type="submit">
            Register
          </button>
          <p class="account-link">
            Already have an account? <a href="login.html">Login</a>
          </p>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Online Shop</p>
    </footer>
    <script type="module" src="../js/register.js"></script>
  </body>
</html>
